name: Verify literature manuscript
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile version 0.3.1
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=manuscript/deposit/v0.3.1 manuscript/deposit/v0.3.1/finite-causal-order-reconstruction.tex
          if grep -E 'Overfull|undefined|There were undefined references' manuscript/deposit/v0.3.1/finite-causal-order-reconstruction.log; then exit 1; fi
